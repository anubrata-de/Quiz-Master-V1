{% extends "base.html" %}

{% block title %}Attempt Quiz - Quiz Master{% endblock %}

{% block content %}
<div class="container mt-4">
    <!-- Quiz Timer -->
    <div class="card bg-dark mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="text-white mb-0">{{ test.title }}</h4>
                <div class="timer-container">
                    <span class="text-white me-2">Time Remaining:</span>
                    <span id="timer" class="badge bg-danger fs-5"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Form -->
    <div class="card bg-dark">
        <div class="card-body">
            <form id="quizForm" method="POST" action="{{ url_for('submit_test', test_id=test.id) }}">
                {% for question in questions %}
                <div class="mb-4">
                    <h5 class="text-white mb-3">{{ loop.index }}. {{ question.text }}</h5>
                    {% for option in question.options %}
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}" 
                               id="option{{ option.id }}" value="{{ option.id }}" required>
                        <label class="form-check-label text-white" for="option{{ option.id }}">
                            {{ option.text }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Quiz</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .card {
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .timer-container {
        background-color: rgba(0, 0, 0, 0.2);
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
    }
    .badge {
        font-size: 1.2rem;
        padding: 0.5rem 1rem;
    }
    .form-check-input:checked {
        background-color: #0d6efd;
        border-color: #0d6efd;
    }
    .form-check-label {
        color: white;
    }
</style>

<script>
    // Parse duration string (HH:MM) to minutes
    function parseDuration(duration) {
        const [hours, minutes] = duration.split(':').map(Number);
        return (hours * 60) + minutes;
    }

    // Format time as HH:MM:SS
    function formatTime(minutes, seconds) {
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // Start countdown timer
    function startTimer(duration) {
        let totalMinutes = parseDuration(duration);
        let totalSeconds = totalMinutes * 60;
        
        const timerElement = document.getElementById('timer');
        const quizForm = document.getElementById('quizForm');
        
        const timer = setInterval(() => {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            timerElement.textContent = formatTime(minutes, seconds);
            
            if (totalSeconds <= 0) {
                clearInterval(timer);
                timerElement.textContent = "Time's Up!";
                quizForm.submit(); // Auto-submit the quiz
            }
            
            totalSeconds--;
        }, 1000);
    }

    // Start the timer when the page loads
    window.onload = function() {
        startTimer("{{ test.time_duration }}");
    };
</script>
{% endblock %}
