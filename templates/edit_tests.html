<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tests</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #333;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            color: #fff;
            padding: 15px 20px;
        }

        nav .logo {
            font-size: 1.5em;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            transition: 0.3s;
        }

        nav ul li a:hover, .btn {
            background: #ff9800;
            border-radius: 5px;
        }

        header {
            text-align: center;
            padding: 50px;
            background: #2196F3;
            color: white;
        }

        section {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
        }

        .admin-card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .admin-card h3 {
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 10px;
            color: white;
            background: #ff9800;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #e68900;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Admin Panel</div>
        <ul>
            <li><a href="{{ url_for('admin_dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('create_test') }}">Create Test</a></li>
            <li><a href="{{ url_for('edit_tests') }}">Edit Test</a></li>
            <li><a href="{{ url_for('logout') }}" class="btn">Logout</a></li>
        </ul>
    </nav>
    
    <header>
        <h1>Edit Tests</h1>
        <p>Select a test to modify its details.</p>
    </header>
    
    <section>
        <h2>Available Tests</h2>
        {% if quizzes %}
            {% for quiz in quizzes %}
            <div class="admin-card">
                <h3>{{ quiz.title }}</h3>
                <p>Test ID: {{ quiz.id }}</p>
                <a href="{{ url_for('edit_test', test_id=quiz.id) }}" class="btn">Edit Test</a>
            </div>
            {% endfor %}
        {% else %}
            <p>No tests available.</p>
        {% endif %}
    </section>
</body>
</html>
