<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .quiz-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .question-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }
        .btn-submit {
            width: 100%;
            background: #007bff;
            color: white;
            font-size: 18px;
        }
        .btn-submit:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="quiz-title">Quiz: {{ quiz.title }}</h2>
        <form action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}" method="POST">
            {% for question in quiz.questions %}
            <div class="question-box">
                <p><strong>{{ loop.index }}. {{ question.text }}</strong></p>
                {% for option in question.options %}
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ option }}" required>
                    <label class="form-check-label">{{ option }}</label>
                </div>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-submit mt-3">Submit Quiz</button>
        </form>
    </div>
</body>
</html>
